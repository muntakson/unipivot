    listen 8089;
    server_name localhost 127.0.0.1;

    root /home/jit/unipivot;
    index index.html;

    access_log /var/log/nginx/unipivot-local.access.log;
    error_log /var/log/nginx/unipivot-local.error.log;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location /assets/ {
        alias /home/jit/unipivot/assets/;
    }

    location /common/ {
        alias /home/jit/unipivot/common/;
    }

    location /css/ {
        alias /home/jit/unipivot/css/;
    }

    location /js/ {
        alias /home/jit/unipivot/js/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/([^/]+)$ {
        try_files $uri $uri.html $uri/ =404;
    }
}
