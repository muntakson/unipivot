server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name unipivot.iotok.org;

    # SSL Configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/unipivot.iotok.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unipivot.iotok.org/privkey.pem;

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 10m;

    root /home/jit/unipivot;
    index index.html;

    # Logging
    access_log /var/log/nginx/unipivot.iotok.org.access.log;
    error_log /var/log/nginx/unipivot.iotok.org.error.log;

    # Static files - main pages
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Assets - CDN content
    location /assets/ {
        alias /home/jit/unipivot/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Common images
    location /common/ {
        alias /home/jit/unipivot/common/;
        expires 30d;
    }

    # Handle custom.cm -> custom.css (must be before /css/ location)
    location = /css/custom.cm {
        alias /home/jit/unipivot/css/custom.css;
        default_type text/css;
        expires 30d;
    }

    # CSS files
    location /css/ {
        alias /home/jit/unipivot/css/;
        expires 30d;
    }

    # JS files
    location /js/ {
        alias /home/jit/unipivot/js/;
        expires 30d;
    }

    # API proxy to Node.js backend
    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Handle URLs without .html extension
    location ~ ^/([^/]+)$ {
        try_files $uri $uri.html $uri/ =404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
}
